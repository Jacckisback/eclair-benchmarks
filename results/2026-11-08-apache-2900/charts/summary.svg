<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" role="img" aria-label="Éclair CMS benchmark summary">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7974} .grid{stroke:#e6e5e0}
  .s1{fill:#6250d6;stroke:#6250d6} .s2{fill:#eb6834;stroke:#eb6834} .s3{fill:#2a78d6;stroke:#2a78d6} .s4{fill:#1baf7a;stroke:#1baf7a} .s5{fill:#eda100;stroke:#eda100}
  .ring{stroke:#fcfcfb} .arrow{stroke:#9a998f} text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f} .grid{stroke:#33332f}
    .s1{fill:#9085e9;stroke:#9085e9} .s2{fill:#d95926;stroke:#d95926} .s3{fill:#3987e5;stroke:#3987e5} .s4{fill:#199e70;stroke:#199e70} .s5{fill:#c98500;stroke:#c98500}
    .ring{stroke:#1a1a19}
  }
</style>
<rect class="bg" width="980" height="250" rx="14"/>
<text class="t1" x="32" y="46" font-size="24" font-weight="700">⚡ Éclair CMS vs WordPress</text>
<text class="t2" x="32" y="72" font-size="14">Same server, same content, open scripts. Éclair 2.0.0 · WordPress 7.1.4 · Apache · 2,900 articles · measured 2026-11-08</text>
<rect class="s1" x="32" y="100" width="4" height="118" rx="2"/>
<text class="t1" x="52" y="160" font-size="52" font-weight="700">1.8×</text>
<text class="t1" x="52" y="190" font-size="16" font-weight="600">faster first byte</text>
<text class="t2" x="52" y="212" font-size="13.5">than WordPress + page cache plugin</text>
<rect class="s1" x="348" y="100" width="4" height="118" rx="2"/>
<text class="t1" x="368" y="160" font-size="52" font-weight="700">2.0×</text>
<text class="t1" x="368" y="190" font-size="16" font-weight="600">faster page build</text>
<text class="t2" x="368" y="212" font-size="13.5">than WordPress, no cache involved</text>
<rect class="s1" x="664" y="100" width="4" height="118" rx="2"/>
<text class="t1" x="684" y="160" font-size="52" font-weight="700">9.6×</text>
<text class="t1" x="684" y="190" font-size="16" font-weight="600">smaller install</text>
<text class="t2" x="684" y="212" font-size="13.5">and no database server</text>
</svg>
