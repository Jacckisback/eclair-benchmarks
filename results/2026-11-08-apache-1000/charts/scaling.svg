<text class="t1" x="634.0" y="149.0" font-size="13.5" font-weight="650">Éclair</text>
<text class="t2 num" x="634.0" y="165.0" font-size="12.5">1,896 req/s</text>
<text class="t1" x="634.0" y="235.0" font-size="13.5" font-weight="650">WordPress + Cache Enabler</text>
<text class="t2 num" x="634.0" y="251.0" font-size="12.5">1,108 req/s</text>
<text class="t1" x="634.0" y="352.9" font-size="13.5" font-weight="650">WordPress</text>
