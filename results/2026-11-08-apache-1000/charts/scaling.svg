<text class="t3 num" x="70" y="165.5" font-size="11.5" text-anchor="end">1,800</text>
<line class="grid" x1="80" y1="96.0" x2="620" y2="96.0" stroke-width="1"/>
<text class="t3 num" x="70" y="100.0" font-size="11.5" text-anchor="end">2,400</text>
<text class="t3 num" x="80.0" y="378" font-size="11.5" text-anchor="middle">1</text>
