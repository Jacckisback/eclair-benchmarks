<text class="t2" x="350.0" y="404" font-size="12.5" text-anchor="middle">Simultaneous connections</text>
<text class="t2" x="24" y="80" font-size="12.5">req/s</text>
<polyline class="s1" style="fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.0,223.8 260.0,116.1 440.0,132.5 620.0,151.0"/>
<circle class="s1 ring" cx="80.0" cy="223.8" r="5" stroke-width="2"/>
