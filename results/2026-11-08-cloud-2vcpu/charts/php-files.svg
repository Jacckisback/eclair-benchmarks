<text class="t1 num" x="615.1" y="203.0" font-size="14" font-weight="650">496 files · 32 SQL</text>
<text class="t2" x="24" y="266" font-size="13">Éclair answers from its page cache with a single PHP file and no database. WordPress loads 496 files and runs 32 SQL queries.</text>
