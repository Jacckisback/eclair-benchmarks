<text class="t3 num" x="430.0" y="242" font-size="11.5" text-anchor="middle">250</text>
<line class="grid" x1="520.0" y1="84" x2="520.0" y2="224" stroke-width="1"/>
<text class="t3 num" x="520.0" y="242" font-size="11.5" text-anchor="middle">375</text>
