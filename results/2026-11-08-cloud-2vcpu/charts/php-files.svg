<text class="t1 num" x="260.0" y="111.0" font-size="14" font-weight="650">1 file · 0 SQL</text>
<text class="t1" x="236" y="154.0" font-size="14" text-anchor="end" font-weight="450">WordPress 7.1.4 + Cache Enabler</text>
<path class="s2" stroke-width="0" d="M250.0 141.0H265.4a4.0 4.0 0 0 1 4.0 4.0V159.0a4.0 4.0 0 0 1 -4.0 4.0H250.0Z"/>
