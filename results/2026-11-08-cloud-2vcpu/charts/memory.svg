<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 282" width="820" height="282" role="img" aria-label="PHP memory used to serve one page">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7974} .grid{stroke:#e6e5e0}
  .s1{fill:#6250d6;stroke:#6250d6} .s2{fill:#eb6834;stroke:#eb6834} .s3{fill:#1baf7a;stroke:#1baf7a}
  .ring{stroke:#fcfcfb} text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f} .grid{stroke:#33332f}
    .s1{fill:#9085e9;stroke:#9085e9} .s2{fill:#d95926;stroke:#d95926} .s3{fill:#199e70;stroke:#199e70} .ring{stroke:#1a1a19}
  }
</style>
<rect class="bg" width="820" height="282" rx="12"/>
<text class="t1" x="24" y="36" font-size="19" font-weight="650">PHP memory used to serve one page</text>
<text class="t2" x="24" y="60" font-size="13.5">Peak memory of the PHP request, article page, OPcache on. Lower is better.</text>
<line class="grid" x1="250.0" y1="84" x2="250.0" y2="224" stroke-width="1"/>
<text class="t3 num" x="250.0" y="242" font-size="11.5" text-anchor="middle">0.0</text>
