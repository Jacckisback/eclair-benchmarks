<text class="t3 num" x="340.0" y="242" font-size="11.5" text-anchor="middle">2.0</text>
<line class="grid" x1="430.0" y1="84" x2="430.0" y2="224" stroke-width="1"/>
<text class="t3 num" x="430.0" y="242" font-size="11.5" text-anchor="middle">4.0</text>
<line class="grid" x1="520.0" y1="84" x2="520.0" y2="224" stroke-width="1"/>
<text class="t3 num" x="520.0" y="242" font-size="11.5" text-anchor="middle">6.0</text>
<line class="grid" x1="610.0" y1="84" x2="610.0" y2="224" stroke-width="1"/>
<text class="t3 num" x="610.0" y="242" font-size="11.5" text-anchor="middle">8.0 MB</text>
<text class="t1" x="236" y="108.0" font-size="14" text-anchor="end" font-weight="650">Éclair 2.0.0</text>
<path class="s1" stroke-width="0" d="M250.0 95.0H262.7a4.0 4.0 0 0 1 4.0 4.0V113.0a4.0 4.0 0 0 1 -4.0 4.0H250.0Z"/>
<text class="t1 num" x="274.7" y="111.0" font-size="14" font-weight="650">0.37 MB</text>
<text class="t1" x="236" y="154.0" font-size="14" text-anchor="end" font-weight="450">WordPress 7.1.4 + Cache Enabler</text>
<path class="s2" stroke-width="0" d="M250.0 141.0H272.2a4.0 4.0 0 0 1 4.0 4.0V159.0a4.0 4.0 0 0 1 -4.0 4.0H250.0Z"/>
<text class="t1 num" x="284.2" y="157.0" font-size="14" font-weight="650">0.58 MB</text>
<text class="t1" x="236" y="200.0" font-size="14" text-anchor="end" font-weight="450">WordPress 7.1.4</text>
<path class="s3" stroke-width="0" d="M250.0 187.0H522.4a4.0 4.0 0 0 1 4.0 4.0V205.0a4.0 4.0 0 0 1 -4.0 4.0H250.0Z"/>
<text class="t1 num" x="534.4" y="203.0" font-size="14" font-weight="650">6.14 MB</text>
<text class="t2" x="24" y="266" font-size="13">Less memory per request means more visitors on the same server, and cheaper hosting.</text>
</svg>
