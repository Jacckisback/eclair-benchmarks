<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Throughput as visitors grow">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7974} .grid{stroke:#e6e5e0}
  .s1{fill:#6250d6;stroke:#6250d6} .s2{fill:#eb6834;stroke:#eb6834} .s3{fill:#1baf7a;stroke:#1baf7a}
  .ring{stroke:#fcfcfb} text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f} .grid{stroke:#33332f}
    .s1{fill:#9085e9;stroke:#9085e9} .s2{fill:#d95926;stroke:#d95926} .s3{fill:#199e70;stroke:#199e70} .ring{stroke:#1a1a19}
  }
</style>
<rect class="bg" width="820" height="420" rx="12"/>
<text class="t1" x="24" y="36" font-size="19" font-weight="650">Throughput as simultaneous visitors grow · article page</text>
<text class="t2" x="24" y="60" font-size="13.5">Requests per second (wrk, 10 s per level). Higher is better.</text>
<line class="grid" x1="80" y1="92.0" x2="600" y2="92.0" stroke-width="1"/>
<text class="t3 num" x="70" y="96.0" font-size="11.5" text-anchor="end">2,400</text>
<line class="grid" x1="80" y1="156.5" x2="600" y2="156.5" stroke-width="1"/>
<text class="t3 num" x="70" y="160.5" font-size="11.5" text-anchor="end">1,800</text>
<line class="grid" x1="80" y1="221.0" x2="600" y2="221.0" stroke-width="1"/>
<text class="t3 num" x="70" y="225.0" font-size="11.5" text-anchor="end">1,200</text>
<line class="grid" x1="80" y1="285.5" x2="600" y2="285.5" stroke-width="1"/>
<text class="t3 num" x="70" y="289.5" font-size="11.5" text-anchor="end">600</text>
<line class="grid" x1="80" y1="350.0" x2="600" y2="350.0" stroke-width="1"/>
<text class="t3 num" x="70" y="354.0" font-size="11.5" text-anchor="end">0</text>
<text class="t3 num" x="80.0" y="370" font-size="11.5" text-anchor="middle">1</text>
<text class="t3 num" x="253.3" y="370" font-size="11.5" text-anchor="middle">10</text>
<text class="t3 num" x="426.7" y="370" font-size="11.5" text-anchor="middle">50</text>
<text class="t3 num" x="600.0" y="370" font-size="11.5" text-anchor="middle">100</text>
<text class="t2" x="340.0" y="394" font-size="12.5" text-anchor="middle">Simultaneous connections</text>
<text class="t2" x="24" y="78" font-size="12.5">req/s</text>
<polyline class="s1" style="fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.0,235.2 253.3,117.0 426.7,124.8 600.0,126.0"/>
<circle class="s1 ring" cx="80.0" cy="235.2" r="5" stroke-width="2"/>
<circle class="s1 ring" cx="253.3" cy="117.0" r="5" stroke-width="2"/>
<circle class="s1 ring" cx="426.7" cy="124.8" r="5" stroke-width="2"/>
<circle class="s1 ring" cx="600.0" cy="126.0" r="5" stroke-width="2"/>
<polyline class="s2" style="fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.0,284.7 253.3,217.5 426.7,224.1 600.0,226.5"/>
<circle class="s2 ring" cx="80.0" cy="284.7" r="5" stroke-width="2"/>
<circle class="s2 ring" cx="253.3" cy="217.5" r="5" stroke-width="2"/>
<circle class="s2 ring" cx="426.7" cy="224.1" r="5" stroke-width="2"/>
<circle class="s2 ring" cx="600.0" cy="226.5" r="5" stroke-width="2"/>
<polyline class="s3" style="fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.0,348.2 253.3,346.2 426.7,346.2 600.0,346.8"/>
<circle class="s3 ring" cx="80.0" cy="348.2" r="5" stroke-width="2"/>
<circle class="s3 ring" cx="253.3" cy="346.2" r="5" stroke-width="2"/>
<circle class="s3 ring" cx="426.7" cy="346.2" r="5" stroke-width="2"/>
<circle class="s3 ring" cx="600.0" cy="346.8" r="5" stroke-width="2"/>
<text class="t1" x="614.0" y="124.0" font-size="13.5" font-weight="650">Éclair</text>
<text class="t2 num" x="614.0" y="140.0" font-size="12.5">2,084 req/s</text>
<text class="t1" x="614.0" y="224.5" font-size="13.5" font-weight="650">WordPress + Cache Enabler</text>
<text class="t2 num" x="614.0" y="240.5" font-size="12.5">1,149 req/s</text>
<text class="t1" x="614.0" y="344.8" font-size="13.5" font-weight="650">WordPress</text>
<text class="t2 num" x="614.0" y="360.8" font-size="12.5">30 req/s</text>
</svg>
