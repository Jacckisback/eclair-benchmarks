<text class="t1" x="634.0" y="198.8" font-size="13.5" font-weight="650">Éclair</text>
<text class="t2 num" x="634.0" y="214.8" font-size="12.5">3,000 req/s</text>
<text class="t1" x="634.0" y="354.5" font-size="13.5" font-weight="650">WordPress</text>
