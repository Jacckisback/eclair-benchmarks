<text class="t2" x="350.0" y="404" font-size="12.5" text-anchor="middle">Simultaneous connections</text>
<text class="t2" x="24" y="80" font-size="12.5">req/s</text>
<polyline class="s1" style="fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.0,254.9 260.0,172.8 440.0,195.9 620.0,200.8"/>
